services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: .
      target: frontend-builder
    ports:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://10.61.13.159:5000
      - HOST=0.0.0.0
      - PORT=3000
      
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=production
    depends_on:
      - backend
    command: npm run start
    working_dir: /app/frontend
    restart: always

  backend:
    build:
      context: .
      target: backend-builder
    ports:
      - "5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_PORT=5000
    command: gunicorn --bind 0.0.0.0:5000 app:app
    working_dir: /app/backend
    restart: always